*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}

<script>
const D={"exams": ["Y22 – Cuối kỳ (Ca 2, 30/11/2024)", "Y20 – Ca 1", "Y20 – Ca 2", "Y19 – Cuối kỳ", "Y19 – Giữa kỳ", "Y18 – Cuối kỳ", "Y18CD – Giữa kỳ", "Y18AB – Giữa kỳ", "Y17 – Cuối kỳ Ngoại 1", "Y17 – Cuối kỳ Ngoại 2"], "chapters": {"1": "Nhiễm trùng ngoại khoa và kháng sinh trong phẫu thuật", "2": "Chuẩn bị bệnh nhân trước mổ và chăm sóc sau mổ", "3": "Cấp cứu bụng ngoại khoa", "4": "Sốc chấn thương", "5": "Tắc động mạch cấp tính", "6": "U máu và dị dạng mạch máu", "7": "Hội chứng viêm phúc mạc", "8": "Sự liền vết thương", "9": "Tắc ruột"}, "q": [{"e": 1, "c": "1", "b": 1, "o": "40", "p": [["Nguyên tắc sử dụng KSDP trước phẫu thuật là gì?", 0, 0], ["a. Chỉ dùng khi có nhiễm trùng", 0, 1], ["b. Chỉ dùng 1 liều hoặc đến 24 giờ sau mổ", 1, 1], ["c. Dùng đến sau mổ tối thiểu là 5 ngày", 0, 1], ["d. Phải phối hợp từ 3 loại KS trở lên", 0, 1]], "i": null, "n": 1, "k": [2], "al": "b", "ac": "Chỉ dùng 1 liều hoặc đến 24 giờ sau mổ", "an": "KSDP dùng trước mổ và ngưng trong 24h sau mổ."}, {"e": 2, "c": "1", "b": 1, "o": "29", "p": [["Kháng sinh dự phòng trước mổ dùng khi nào tốt nhất", 0, 0], ["A. 30-60p trước rạch da", 1, 1], ["B. 2h trước mổ", 0, 1], ["C. Kháng sinh khi BN có dấu hiệu nhiễm trùng", 0, 1], ["D. ?", 0, 1]], "i": null, "n": 2, "k": [1], "al": "A", "ac": "30 - 60 phút trước rạch da", "an": "Đảm bảo nồng độ thuốc tối đa trong mô khi rạch da."}, {"e": 3, "c": "1", "b": 1, "o": "19", "p": [["Kháng sinh điều trị, chọn câu đúng:", 0, 0], ["A. Cótừ khi phát minh ra KS, được sử dụng theo KSĐ hoặc kinh nghiệm", 1, 1], ["B. Phải là kiềm khuẩn", 0, 1], ["C. Phải là diệt khuẩn", 0, 1], ["D. KSmạnh, phổ rộng, liều ít độc tính, tác dụng mạnh, ít tác dụng phụ", 0, 1]], "i": null, "n": 3, "k": [1], "al": "A", "ac": "Có từ khi phát minh ra KS, dùng theo KSĐ hoặc kinh nghiệm", "an": "Đặc điểm của liệu pháp kháng sinh điều trị."}, {"e": 3, "c": "1", "b": 1, "o": "20", "p": [["Nhiễm trùng huyết (Sepsis) là gì ?", 0, 0], ["A. Viêm nội tâm mạc", 0, 1], ["B. Sự giảm tưới máu ở TM ngoại biên dẫn đến thiếu oxi mô", 0, 1], ["C. Là suy giảm chức năng các cơ quan do thiếu máu tưới đến mô", 1, 1]], "i": null, "n": 4, "k": [3], "al": "C", "ac": "Suy giảm chức năng các cơ quan do thiếu máu tưới đến mô", "an": "Rối loạn chức năng đa cơ quan do đáp ứng nhiễm trùng."}, {"e": 5, "c": "1", "b": 1, "o": "", "p": [["Nhiễm trùng huyết (Sepsis) là?", 0, 0], ["A. Viêm nội tâm mạc", 0, 1], ["B. Sự giảm tưới máu ở ngoại biên", 0, 1], ["C. Là suy giảm chức năng các cơ quan do thiếu máu tưới đến mô", 1, 1], ["D.", 0, 1]], "i": null, "n": 5, "k": [3], "al": "C", "ac": "Suy giảm chức năng cơ quan do thiếu máu tưới đến mô", "an": "Định nghĩa Sepsis theo cơ chế tổn thương tưới máu."}, {"e": 5, "c": "1", "b": 1, "o": "", "p": [["Tiêu chuẩn SIRS là đáp ứng 2 trên 4 yếu tố sau?", 0, 0], ["a. Nhiệt độ 38 độ, HA > 90, nhịp thở 20, paCO2 32mmHg, BC trên 12000", 1, 1], ["b. Nhiệt độ 45 độ, nhịp thở 60, paCO2 32mmHg, BC 4000", 0, 1]], "i": 3, "n": 6, "k": [1], "al": "A", "ac": "T > 38°C, NT > 20, BC > 12.000, PaCO2 < 32 mmHg", "an": "Tiêu chuẩn hội chứng đáp ứng viêm toàn thân (SIRS)."}, {"e": 5, "c": "1", "b": 1, "o": "", "p": [["Kháng sinh điều trị, chọn câu đúng?", 0, 0], ["A. Có từ khi phát minh ra KS, được sử dụng theo kháng sinh đồ hoặc kinh nghiêm", 1, 1], ["B. Có tính diệt khuẩn", 0, 1], ["C. Có tính khử khuẩn", 0, 1], ["D. Phổ rộng, liều ít độc tính, tác dụng mạnh", 0, 1]], "i": null, "n": 7, "k": [1], "al": "A", "ac": "Có từ khi phát minh ra KS, dùng theo KSĐ hoặc kinh nghiệm", "an": "Tính chất dùng KS theo kháng sinh đồ hoặc kinh nghiệm."}, {"e": 8, "c": "1", "b": 1, "o": "7", "p": [["Nguyên tắc chọn kháng sinh dự phòng:", 0, 0], ["A. Gía thành rẻ...", 0, 1], ["B. Có phổ thích hợp với vi trùng cần diệt", 0, 1], ["C. Nồng độ... còn lại để cơ thể tự hồi phục", 0, 1], ["D. Tất cả đúng", 1, 1]], "i": null, "n": 8, "k": [4], "al": "D", "ac": "Tất cả đúng", "an": "Phổ tác dụng, an toàn, nồng độ tại mô cần phẫu thuật."}, {"e": 8, "c": "1", "b": 1, "o": "9", "p": [["Nguyên tắc chọn KS dự phòng là:", 0, 0], ["A. An toàn, dung nạp tốt, kiểm soát được các ổ có nguy cơ nhiễm trùng, ít độc.", 0, 1], ["B. KS có quang phổ thích hợp với vi trùng cần diệt", 0, 1], ["C. Giá thành rẻ và không phải là kháng sinh mạnh (dành cho KS điều trị).", 0, 1], ["D. Cả 3 câu trên đều đúng.", 1, 1]], "i": null, "n": 9, "k": [4], "al": "D", "ac": "Cả 3 câu trên đều đúng", "an": "Nguyên tắc chọn lựa kháng sinh dự phòng tối ưu."}, {"e": 1, "c": "1", "b": 2, "o": "11", "p": [["Sau mổ VRT vết mổ nề, chảy dịch, nghĩ do nhiễm khuẩn tác nhân nào [4]", 0, 0], ["A. Vi khuẩn gram âm (E.coli, Klebsiella)", 1, 1], ["B. Staphylococcus aureus", 0, 1]], "i": null, "n": 10, "k": [1], "al": "A", "ac": "Vi khuẩn Gram âm (E.coli, Klebsiella)", "an": "Tác nhân thường trú chiếm đa số trong ổ viêm ruột thừa."}, {"e": 2, "c": "1", "b": 2, "o": "28", "p": [["Nguyên tắc quan trọng nhất trong điều trị nhiễm trùng ngoại khoa (2)", 0, 0], ["A. Dẫn lưu tháo mủ → AH, PĐ, KH → chốt", 1, 1], ["B. KS phổ rộng", 0, 1], ["C. Phối hợp nhiều loại kháng sinh → V, ST", 0, 1], ["D. ?", 0, 1]], "i": null, "n": 11, "k": [1], "al": "A", "ac": "Dẫn lưu tháo mủ", "an": "Nguyên lý ngoại khoa kinh điển: Ubi pus, ibi evacua."}, {"e": 3, "c": "1", "b": 2, "o": "18", "p": [["Biến chứng nhiễm trùng thành bụng:", 0, 0], ["A. Hở da, lộ cân", 0, 1], ["B. Phù nề, sưng đỏ", 0, 1], ["C. Nhiễm trùng, bung vết mổ thành bụng", 1, 1], ["D. Đỏ, ấn đau", 0, 1]], "i": null, "n": 12, "k": [3], "al": "C", "ac": "Nhiễm trùng, bung vết mổ thành bụng", "an": "Biến chứng cơ học và nhiễm khuẩn nặng nề nhất."}, {"e": 8, "c": "1", "b": 2, "o": "8", "p": [["Các nguy cơ làm gia tăng nhiễm trùng sau mổ bao gồm:", 0, 0], ["A. Tất cả các nguyên nhân làm thiếu oxy đến các mô", 0, 1], ["B. Các nguyên nhân gây rối loạn hoạt động của vi tuần hoàn.", 0, 1], ["C. Các tình huống (như mất máu, dịch - máu không được làm ấm trước khi truyền…)", 0, 1], ["D. Cả 3 câu đều đúng.", 1, 1]], "i": null, "n": 13, "k": [4], "al": "D", "ac": "Cả 3 câu đều đúng", "an": "Giảm tưới máu mô, rối loạn vi tuần hoàn, hạ thân nhiệt."}, {"e": 8, "c": "1", "b": 2, "o": "10", "p": [["Các trường hợp có nguy cơ nhiễm trùng cao cần KS dự phòng bao gồm:", 0, 0], ["A. Mổ cấp cứu nhất là trường hợp có sốc chấn thương", 0, 1], ["B. BN có bệnh cơ địa", 0, 1], ["C. BN cao tuổi (trên 70) hoặc cuộc mổ kéo dài trên 4h", 0, 1], ["D. Cả 3 câu trên đều đúng.", 1, 1]], "i": null, "n": 14, "k": [4], "al": "D", "ac": "Cả 3 câu trên đều đúng", "an": "Mổ cấp cứu, bệnh nền nặng, người già, mổ kéo dài > 4h."}, {"e": 8, "c": "1", "b": 2, "o": "11", "p": [["Dự phòng trong phẫu thuật đại trực tràng phải thỏa mãn 3 điều kiện sau:", 0, 0], ["A. Kháng sinh phải đạt được nồng độ cao trong huyết thanh cũng như ở thành đại tràng.", 0, 1], ["B. Hạn chế mật độ vi trùng ở đại tràng qua thụt tháo kèm theo KS đường uống.", 0, 1], ["C. Kháng sinh phối hợp để kiểm soát cả VT hiếu khí và kỵ khí", 0, 1], ["D. Cả 3 câu trên đều đúng.", 1, 1]], "i": null, "n": 15, "k": [4], "al": "D", "ac": "Cả 3 câu trên đều đúng", "an": "Nồng độ mô cao, làm sạch lòng ruột, bao phủ kỵ khí + hiếu khí."}, {"e": 8, "c": "1", "b": 2, "o": "12", "p": [["Nguyên tắc điều trị nhiễm trùng do phẫu thuật là:", 0, 0], ["A. Điều trị kết hợp với các KS cộng lực", 0, 1], ["B. KS không giữ vai trò độc tôn trong chống nhiễm trùng (Có mủ phải thoát mủ).", 0, 1], ["C. KS chỉ hỗ trợ bảo vệ tại chỗ cho đến khi toàn thân đủ sức chống đỡ.", 0, 1], ["D. Cả 3 câu trên đều đúng.", 1, 1]], "i": null, "n": 16, "k": [4], "al": "D", "ac": "Cả 3 câu trên đều đúng", "an": "Kháng sinh chỉ hỗ trợ giải quyết ổ mủ bằng ngoại khoa."}, {"e": 1, "c": "1", "b": 3, "o": "49", "p": [["Áp xe da ở lưng (?) #5x6cm, xử trí gì? [13]", 0, 0], ["a. Rạch lỗ nhỏ vừa đủ để thẩm mỹ sau này", 0, 1], ["b. Rạch rộng, để hở", 1, 1], ["c. Rạch rộng, tưới rửa, khâu lại", 0, 1], ["d. Kháng sinh mạnh", 0, 1]], "i": null, "n": 17, "k": [2], "al": "b", "ac": "Rạch rộng, để hở", "an": "Ổ áp xe mô mềm kích thước 5x6 cm cần mở rộng dẫn lưu."}, {"e": 2, "c": "1", "b": 3, "o": "30", "p": [["Kháng sinh viêm đường mật ban đầu", 0, 0], ["A. Clarithromycin", 0, 1], ["B. Ceftriaxone+ Metronidazole", 1, 1], ["C. Penicillin", 0, 1], ["D. Amoxicillin", 0, 1]], "i": null, "n": 18, "k": [2], "al": "B", "ac": "Ceftriaxone + Metronidazole", "an": "Kháng sinh bao phủ trực khuẩn Gram (-) và kỵ khí đường mật."}, {"e": 2, "c": "1", "b": 3, "o": "31", "p": [["Sau mổ thoát vị bẹn 5 ngày, thấy vết mổ đỏ, sưng, mủ, bị gì", 0, 0], ["A. NT vết mổ", 1, 1], ["B. Xuất huyết vết mổ", 0, 1], ["C. Liền thì 2", 0, 1], ["D. Biến chứng của lành thương thì đầu", 0, 1]], "i": null, "n": 19, "k": [1], "al": "A", "ac": "Nhiễm trùng vết mổ", "an": "Vết mổ sưng, nóng, đỏ, chảy mủ sau phẫu thuật 5 ngày."}, {"e": 7, "c": "1", "b": 3, "o": "1", "p": [["Một bệnh nhân nữ 35 tuổi vừa phẫu thuật nội soi cắt túi mật. Trong trường hợp này, việc sử dụng kháng sinh như thế nào là phù hợp?", 0, 0], ["A. Cho kháng sinh dự phòng", 1, 1], ["B. Cho kháng sinh điều trị", 0, 1], ["C. Không cho kháng sinh", 0, 1], ["D. Cho kháng sinh sau mổ", 0, 1]], "i": null, "n": 20, "k": [1], "al": "A", "ac": "Cho kháng sinh dự phòng", "an": "Cắt túi mật nội soi thuộc phân loại mổ sạch - nhiễm."}, {"e": 8, "c": "1", "b": 3, "o": "6", "p": [["BN nữ 35t, cần Phẫu thuật sỏi túi mật thì nên xài kháng sinh nào?", 0, 0], ["A. Dùng kháng sinh dự phòng", 1, 1], ["B. Dùng KS rx", 0, 1], ["C. Dùng KS sau mổ", 0, 1], ["D. ...", 0, 1]], "i": null, "n": 21, "k": [1], "al": "A", "ac": "Dùng kháng sinh dự phòng", "an": "Phẫu thuật sỏi túi mật theo chương trình chỉ dùng KSDP."}, {"e": 1, "c": "2", "b": 1, "o": "43", "p": [["Thời gian cần nhịn thức ăn đặc tối thiểu mấy tiếng trước PT theo ERAS? [11]", 0, 0], ["a. 2 giờ", 0, 1], ["b. 4 giờ", 0, 1], ["c. 6 giờ", 1, 1], ["d. 8 giờ", 0, 1]], "i": null, "n": 1, "k": [3], "al": "c", "ac": "6 giờ (hoặc 8 giờ)", "an": "Tiêu chuẩn ERAS/ASA: nhịn thức ăn đặc tối thiểu 6 tiếng."}, {"e": 2, "c": "2", "b": 1, "o": "32", "p": [["Theo ERAS, sau phẫu thuật cắt đại tràng nên cho ăn lại khi (4)", 0, 0], ["A. Ngay sau mổ", 0, 1], ["B. Sau mổ 24h", 0, 1], ["C. Sau khi có trung đại tiện", 0, 1], ["D. Càng sớm càng tốt", 1, 1]], "i": null, "n": 2, "k": [4], "al": "D", "ac": "Càng sớm càng tốt", "an": "ERAS khuyến khích tái lập đường ăn uống sớm sau mổ."}, {"e": 3, "c": "2", "b": 1, "o": "16", "p": [["Chăm sóc sau mổ gồm giai đoạn nào:", 0, 0], ["A. Chăm sóc hồi tỉnh và chăm sóc sau mổ", 1, 1], ["B. Điều chỉnh rối loạn điện giải", 0, 1], ["C. Ổn định Nôn ói, bí trung đại tiện", 0, 1], ["D. Hồi tỉnh, …", 0, 1]], "i": null, "n": 3, "k": [1], "al": "A", "ac": "Chăm sóc hồi tỉnh và chăm sóc sau mổ", "an": "Phân kỳ theo dõi liên tục từ phòng PACU về buồng bệnh."}, {"e": 3, "c": "2", "b": 1, "o": "17", "p": [["Hiện nay, chuẩn bị cho BN trước khi phẫu thuật đại tràng", 0, 0], ["A. Thụt tháo 4 ngày liên tiếp", 0, 1], ["B. Chỉ cần uống nước sạch 3-5 ngày trước mổ", 0, 1], ["C. Chuẩn bị đại tràng bằng đường uống với Neomycin và Erythromycin", 0, 1], ["D. uống nước sạch từ 12-24h, uống nước tẩy nhẹ (saline laxative hoặc propylene glycol)", 1, 1]], "i": null, "n": 4, "k": [4], "al": "D", "ac": "Uống nước sạch 12-24h, thuốc tẩy nhẹ (PEG/saline)", "an": "Quy trình chuẩn bị ruột hiện đại không dùng thụt tháo kéo dài."}, {"e": 5, "c": "2", "b": 1, "o": "", "p": [["Chuẩn bị BN lớn tuổi trước mổ cần lưu ý ?", 0, 0], ["A. Suy giảm nhận thức và mê sảng, quản lý thuốc, yếu liệt", 0, 1], ["B. Tâm thần kinh, thuốc đã dùng, chức năng các cơ quan", 1, 1], ["C. Tiền căn THA", 0, 1], ["D. COPD, dinh dưỡng", 0, 1]], "i": null, "n": 5, "k": [2], "al": "B", "ac": "Tâm thần kinh, thuốc đã dùng, chức năng cơ quan", "an": "Đánh giá lão khoa toàn diện trước gây mê phẫu thuật."}, {"e": 5, "c": "2", "b": 1, "o": "", "p": [["Chuẩn bị BN trước mồ gồm?", 0, 0], ["A. BS phẫu thuật, BS gây mê hồi sức, BS tim mạch", 0, 1], ["B. BS phẫu thuật, BS niệu, BS gây mệ hồi sức", 0, 1], ["C. BS phẫu thuật, BS nội, BS gây mê hồi sức", 1, 1], ["D. BS gây mê hồi sức…", 0, 1]], "i": null, "n": 6, "k": [3], "al": "C", "ac": "BS phẫu thuật, BS nội, BS gây mê hồi sức", "an": "Hội chẩn đa chuyên khoa đánh giá nguy cơ phẫu thuật."}, {"e": 5, "c": "2", "b": 1, "o": "59", "p": [["Tư vấn BN trước mổ gồm những nội dung gì?", 0, 0], ["A. Chẩn đoán bệnh, kết quả và nguy cơ của những can thiệp, các phương pháp phẫu thuật thay thế", 1, 1], ["B. Thông báo tiền viện phí", 0, 1], ["C. Thông báo thời gian nằm viện", 0, 1], ["D. Thông báo về thuốc đang sử dụng", 0, 1]], "i": 2, "n": 7, "k": [1], "al": "A", "ac": "Chẩn đoán, lợi ích, rủi ro can thiệp và phương pháp thay thế", "an": "Tiêu chuẩn cam kết phẫu thuật đồng thuận (Informed Consent)."}, {"e": 8, "c": "2", "b": 1, "o": "55", "p": [["BN mổ chương trình cần chuẩn bị trước mổ những gì?", 0, 0], ["A. Dinh dưỡng", 0, 1], ["B. Điều chỉnh rối loạn cơ quan", 0, 1], ["C. …", 0, 1], ["D. Tất cả đúng", 1, 1]], "i": null, "n": 8, "k": [4], "al": "D", "ac": "Tất cả đúng", "an": "Bao gồm dinh dưỡng, chức năng cơ quan, ổn định bệnh nền."}, {"e": 2, "c": "2", "b": 2, "o": "33", "p": [["Chăm sóc sau mổ quan trọng nhất để dự phòng huyết khối tĩnh mạch sâu", 0, 0], ["A. Vận động sớm", 1, 1], ["B. Thuốc kháng đông dự phòng", 0, 1]], "i": null, "n": 9, "k": [1], "al": "A", "ac": "Vận động sớm", "an": "Biện pháp vật lý quan trọng nhất ngăn ngừa DVT sau mổ."}, {"e": 3, "c": "2", "b": 2, "o": "60", "p": [["Hậu phẫu ngày 4 thường gặp biến chứng nào", 0, 0], ["A. Xì dò miệng nối tiêu hoá", 1, 1], ["B. Xì vết mổ", 0, 1], ["C. Viem phổi", 0, 1]], "i": null, "n": 10, "k": [1], "al": "A", "ac": "Xì rò miệng nối tiêu hoá", "an": "Biến chứng thiếu máu miệng nối thường bộc lộ vào N4 - N7."}, {"e": 7, "c": "2", "b": 2, "o": "14", "p": [["Trước khi phẫu thuật, việc chuẩn bị tư vấn tâm lý cho bệnh nhân có mục đích quan trọng nhất là gì?", 0, 0], ["A. Bệnh nhân biết được chỉ định phẫu thuật.", 0, 1], ["B. Bệnh nhân biết được lý do nằm viện.", 0, 1], ["C. Bệnh nhân biết được bệnh và tin tưởng phẫu thuật", 1, 1], ["D. Bệnh nhân biết được bác sĩ phẫu thuật.", 0, 1]], "i": null, "n": 11, "k": [3], "al": "C", "ac": "Bệnh nhân biết được bệnh và tin tưởng phẫu thuật", "an": "Mục tiêu giảm âu lo, nâng cao khả năng hợp tác hậu phẫu."}, {"e": 8, "c": "2", "b": 2, "o": "53", "p": [["Tại sao phải chuẩn bị tâm lý BN trước mổ?", 0, 0], ["A. Để BN biết về bác sĩ phẫu thuật", 0, 1], ["B. Để BN biết chỉ định phẫu thuật", 0, 1], ["C. Để BN biết về tình trạng bệnh và tin vào cuộc phãu thuật", 1, 1], ["D. Để BN biết lý do nằm viện", 0, 1]], "i": null, "n": 12, "k": [3], "al": "C", "ac": "Bệnh nhân biết về tình trạng bệnh và tin vào phẫu thuật", "an": "Chuẩn bị tâm lý nâng cao hiệu quả hồi phục."}, {"e": 1, "c": "2", "b": 3, "o": "44", "p": [["BN mới mổ nằm lâu hậu phẫu 5 ngày, đột ngột khó thở, tụt spo2 nghĩ gì", 0, 0], ["A. Viêm phổi nặng", 0, 1], ["B. Thuyên tắc phổi", 1, 1]], "i": null, "n": 13, "k": [2], "al": "B", "ac": "Thuyên tắc phổi (PE)", "an": "Hậu phẫu bất động, khó thở đột ngột, tụt SpO2."}, {"e": 1, "c": "2", "b": 3, "o": "45", "p": [["BN được chỉ định PT khớp háng có tiền căn BMV đang dùng kháng đông, xử trí gì [12]", 0, 0], ["a. Ngưng kháng đông ngay trước mổ", 0, 1], ["b. Ngưng kháng đông trước mổ ít nhất 5 ngày", 1, 1], ["c. Điều chỉnh kháng đông", 0, 1], ["d. Không cần ngưng kháng đông", 0, 1]], "i": null, "n": 14, "k": [2], "al": "b", "ac": "Ngưng kháng đông trước mổ ít nhất 5 ngày", "an": "Khoảng thời gian cần thiết để hồi phục đông máu an toàn."}, {"e": 1, "c": "2", "b": 3, "o": "46", "p": [["Hậu phẫu tiêu hóa N3-4 BN đau bụng nhiều, có dịch tiêu hóa qua ống dẫn lưu, nghĩ đến biến chứng gì?", 0, 0], ["a. Xì rò miệng nối tiêu hóa", 1, 1], ["b.", 0, 1]], "i": null, "n": 15, "k": [1], "al": "a", "ac": "Xì rò miệng nối tiêu hóa", "an": "Đau bụng kèm dịch tiêu hóa thoát qua ống dẫn lưu N3-N4."}, {"e": 8, "c": "2", "b": 4, "o": "54", "p": [["1 BN sau cắt thuỳ phải gan được 2 ngày thì vàng da, tăng bilirubin, tăng INR. Siêu âm ko thấy dãn đường mật, không thấy tụ dịch. Nghĩ nhiều?", 0, 0], ["A. Vàng da sau gan do tắc mật", 0, 1], ["B. Vàng da trước gan do tán huyết", 0, 1], ["C. Vàng da tại gan do suy gan", 1, 1], ["D. Vàng da tại gan do rò mật.", 0, 1]], "i": null, "n": 16, "k": [3], "al": "C", "ac": "Vàng da tại gan do suy gan", "an": "Bilirubin và INR tăng, không tắc mật trên SA sau cắt gan."}, {"e": 8, "c": "2", "b": 4, "o": "56", "p": [["BN 78 tuổi tiền căn hút thuốc, phẫu thuật cắt u xơ tiền liệt tuyến. Hậu phẫu N2 sốt, khó thở. Nghĩ gì nhiều nhất?", 0, 0], ["A. Viêm phổi", 0, 1], ["B. Xẹp phổi", 1, 1], ["C. Tràn dịch màng phổi", 0, 1], ["D. Thuyên tắc phổi", 0, 1]], "i": null, "n": 17, "k": [2], "al": "B", "ac": "Xẹp phổi (Atelectasis)", "an": "Biến chứng hô hấp gây sốt và khó thở sớm nhất (trong 48h)."}, {"e": 8, "c": "2", "b": 4, "o": "57", "p": [["BN 57 tuổi, sau phẫu thuật nối hỗng tràng - đại tràng ngang, hậu phẫu N4 bắt đầu sốt, không đau bụng, ống dẫn lưu ra dịch tiêu hóa. Nghĩ tới gì?", 0, 0], ["A. Viêm phúc mạc do xì dò miệng nối", 0, 1], ["B. Xì dò miệng nối ra ngoài", 1, 1], ["C. Rò dịch nhiễm trùng", 0, 1], ["D. Bục miệng nối", 0, 1]], "i": null, "n": 18, "k": [2], "al": "B", "ac": "Xì dò miệng nối ra ngoài", "an": "Dẫn lưu ra dịch ruột nhưng bụng không có dấu hiệu viêm lan tỏa."}, {"e": 0, "c": "3", "b": 1, "o": "55", "p": [["Theo sự phân bố thần kinh cảm giác của phúc mạc thì vùng nào sau đây của phúc mạc là có cảm ứng nhạy nhất:", 0, 0], ["A. Phúc mạc thành bụng trước.", 1, 1], ["B. Phúc mạc thành bụng bên phải.", 0, 1], ["C. Phúc mạc thành bụng bên trái.", 0, 1], ["D. Phúc mạc thành bụng hố chậu phải", 0, 1]], "i": null, "n": 1, "k": [1], "al": "A", "ac": "Phúc mạc thành bụng trước", "an": "Nhận nhiều sợi thần kinh soma tủy gai nhất nên nhạy nhất."}, {"e": 0, "c": "3", "b": 2, "o": "30", "p": [["Đau tạng có cảm giác", 0, 0], ["A. Đau âm ỉ và ít khu trú", 1, 1], ["B. Đau dữ dội, liên tục C…", 0, 1]], "i": null, "n": 2, "k": [1], "al": "A", "ac": "Đau âm ỉ và ít khu trú", "an": "Đặc tính đau thần kinh tự chủ tạng (Visceral pain)."}, {"e": 3, "c": "3", "b": 2, "o": "30", "p": [["Sự chính xác trong chẩn đoán bụng ngoại khoa bị hạn chế là do phụ thuộc nhiều vào", 0, 0], ["A. Trình độ thầy thuốc", 1, 1], ["B. KN của thầy thuốc", 1, 1], ["C. XN sinh hóa-huyết học", 0, 1], ["D. Phương tiện chẩn đoán hình ảnh", 0, 1]], "i": null, "n": 3, "k": [1, 2], "al": "B (hoặc A)", "ac": "Kinh nghiệm / Trình độ của thầy thuốc", "an": "Chẩn đoán phụ thuộc lớn vào kỹ năng thăm khám lâm sàng."}, {"e": 3, "c": "3", "b": 2, "o": "31", "p": [["Sờ bụng trong khám một bệnh nhân đau bụng cấp có đặc điểm", 0, 0], ["A. Đóng vai trò quan trọng bậc nhất chẩn đoán nguyên nhân đau bụng", 0, 1], ["B. Đóng vai trò quan trọng bậc nhất trong chẩn đoán bụng ngoại khoa", 1, 1], ["C. Phụ thuộc khách quan vào thầy thuốc khám", 0, 1], ["D. Mang tính chất chủ quan của người bệnh", 0, 1]], "i": null, "n": 4, "k": [2], "al": "B", "ac": "Đóng vai trò quan trọng bậc nhất chẩn đoán bụng ngoại khoa", "an": "Phát hiện đề kháng, co cứng, cảm ứng phúc mạc."}, {"e": 5, "c": "3", "b": 2, "o": "", "p": [["Trong đau bụng cấp, triệu chứng đau bụng có nguồn gốc từ?", 0, 0], ["A. Đau tạng chuyển sang thành", 0, 1], ["B. Đau là chủ quan của BN", 0, 1], ["C. Đau căng phúc mạc tạng", 0, 1], ["D. Kích thích phúc mạc thành", 1, 1]], "i": null, "n": 5, "k": [4], "al": "D", "ac": "Kích thích phúc mạc thành", "an": "Khi tổn thương lan rộng chạm vào lá thành tạo đau khu trú rõ."}, {"e": 5, "c": "3", "b": 2, "o": "", "p": [["BN đau bụng cấp, sinh hiệu ổn, tiếp cận cần lưu ý gì?", 0, 0], ["A. Đặc điểm của đau", 0, 1], ["B. Tiền sử và bệnh sử", 0, 1], ["C. Các yếu tố tăng giảm của đau", 0, 1], ["D. Hỏi bệnh và thăm khám", 1, 1]], "i": null, "n": 6, "k": [4], "al": "D", "ac": "Hỏi bệnh và thăm khám", "an": "Phương pháp nền tảng quyết định hướng xử trí ban đầu."}, {"e": 5, "c": "3", "b": 2, "o": "", "p": [["BN đau bụng cấp, kỹ năng khám sờ bụng, chọn câu đúng?", 0, 0], ["A. quan trọng trong việc bậc nhất trong đánh giá bụng ngoại khoa", 1, 1], ["B. Quan trọng bậc nhất để chẩn đoán nguyên nhân", 0, 1], ["C. Cảm giác chủ quan người bệnh", 0, 1], ["D. Cảm giác khách quan người bệnh để bác sĩ dễ chẩn đoán xác định", 0, 1]], "i": null, "n": 7, "k": [1], "al": "A", "ac": "Quan trọng bậc nhất trong đánh giá bụng ngoại khoa", "an": "Xác định chỉ định phẫu thuật khẩn cấp."}, {"e": 0, "c": "3", "b": 3, "o": "18", "p": [["BN nhập viện có nôn, thỉnh thoảng trung tiện được, không đại tiện được. Ấn đau hố chậu (P), không có dấu đề kháng. CLS cần làm:", 0, 0], ["A. Công thức máu", 0, 1], ["B. CT bụng", 1, 1], ["C. X quang bụng không sửa soạn", 0, 1], ["D. …", 0, 1]], "i": null, "n": 8, "k": [2], "al": "B", "ac": "CT bụng (hoặc X-quang)", "an": "Khảo sát toàn diện nguyên nhân tắc ruột hoặc đau hố chậu."}, {"e": 1, "c": "3", "b": 3, "o": "37", "p": [["Theo ACR, cận lâm sàng nào được chỉ định đầu tiên trong trường hợp cấp cứu ở phụ nữ đang không mang thai có đau bụng + đau HCP (hay HSP ta) [9]", 0, 0], ["a. Siêu âm bụng", 1, 1], ["b. CT scan", 0, 1], ["c. MRI", 0, 1], ["d. Nội soi", 0, 1]], "i": null, "n": 9, "k": [1], "al": "a", "ac": "Siêu âm bụng", "an": "Theo ACR, siêu âm là bước đầu tiên ở nữ không mang thai."}, {"e": 9, "c": "3", "b": 3, "o": "3", "p": [["BN nam đau bụng cấp, nôn ói, không hợp tác cho khám bụng, nằm tư thế bào thai, cận lâm sàng chẩn đoán?", 0, 0], ["A. CT-scan", 1, 1], ["B. Xét nghiệm sinh hóa", 0, 1], ["C. Nội soi ổ bụng", 0, 1], ["D. XQ ngực bụng", 0, 1]], "i": null, "n": 10, "k": [1], "al": "A", "ac": "CT-scan", "an": "Phương tiện chẩn đoán khách quan khi bệnh nhân không thể khám."}, {"e": 1, "c": "4", "b": 1, "o": "51", "p": [["Sốc chấn thương MAP cần đạt ít nhất", 0, 0], ["a. 60", 1, 1], ["b. 79", 0, 1], ["c. 80", 0, 1], ["d. 90", 0, 1]], "i": 0, "n": 1, "k": [1], "al": "a", "ac": "Huyết áp trung bình MAP đạt ít nhất 60 mmHg", "an": "Áp lực tối thiểu bảo đảm tưới máu não và thận."}, {"e": 2, "c": "4", "b": 1, "o": "9", "p": [["Dấu hiệu sớm nhất của sốc?", 0, 0], ["A. Thở nhanh", 0, 1], ["B. Huyết áp tụt", 0, 1], ["C. Mạch nhanh D. ĐT góc gan", 0, 1]], "i": null, "n": 11, "k": [2], "al": "B", "ac": "Manh tràng", "an": "Nguy cơ dọa vỡ manh tràng khi đường kính > 10 - 12 cm."}, {"e": 9, "c": "9", "b": 2, "o": "41", "p": [["Nhồi máu thường gặp trong tắc ruột nào?", 0, 0], ["A. Xoắn ruột non", 1, 1], ["B. Lồng ruột non", 0, 1], ["C. Tắc ruột do dính", 0, 1], ["D. Tắc ruột đơn thuần", 0, 1]], "i": null, "n": 12, "k": [1], "al": "A", "ac": "Xoắn ruột non", "an": "Thiếu máu nhồi máu do xoắn vặn cuống mạch mạc treo ruột non."}, {"e": 9, "c": "9", "b": 2, "o": "43", "p": [["Tắc ruột cần mổ cấp cứu càng sớm càng tốt?", 0, 0], ["A. Do dính", 0, 1], ["B. Do bã thức ăn", 0, 1], ["C. Thắt nghẹt", 1, 1]], "i": null, "n": 13, "k": [3], "al": "C", "ac": "Thắt nghẹt", "an": "Chỉ định mổ cấp cứu tối khẩn nhằm tránh hoại tử ruột."}, {"e": 9, "c": "9", "b": 2, "o": "44", "p": [["Tắc ruột tiên lượng tốt nhất", 0, 0], ["A. Đơn thuần do u", 0, 1], ["B. Do dính", 1, 1], ["C. Thắt nghẹt", 0, 1]], "i": null, "n": 14, "k": [2], "al": "B", "ac": "Do dính", "an": "Nhiều trường hợp đáp ứng tốt với hồi sức nội khoa, ít nguy cơ hoại tử sớm."}, {"e": 9, "c": "9", "b": 2, "o": "45", "p": [["Tắc ruột tiên lượng kém nhất", 0, 0], ["A. Tắc ruột non do thoát vị bẹn nghẹt", 1, 1], ["B. Tắc ruột đơn thuần do u", 0, 1]], "i": null, "n": 15, "k": [1], "al": "A", "ac": "Tắc ruột non do thoát vị bẹn nghẹt", "an": "Nguy cơ hoại tử đoạn ruột nghẹt và sốc nhiễm trùng cao."}, {"e": 9, "c": "9", "b": 2, "o": "49", "p": [["K đại tràng (T) hay gặp thủng ở? Manh tràng", 0, 0]], "i": null, "n": 16, "k": [], "al": "—", "ac": "Manh tràng", "an": "Vị trí thủng hay gặp do quai kín với van hồi manh tràng đóng kín."}, {"e": 1, "c": "9", "b": 3, "o": "6", "p": [["BN nữ 70 tuổi, thể trạng suy kiệt, nhập viện ghi nhận hội chứng tắc ruột thấp, bí trung đại tiện, bụng chướng, đau mơ hồ. Khám hậu môn trực tràng trống, không ghi nhận u sùi hậu môn, không máu theo găng. Nội soi đại tràng ghi nhận khối u gây tắc chỗ nối đại tràng sigma với trực tràng. Điều trị gì?", 0, 0], ["a. Bù dịch, ổn định tổng trạng, phẫu thuật để cắt đại tràng triệt căn", 0, 1], ["b. Bù dịch, ổn định tổng trạng, phẫu thuật mở hậu môn nhân tạo ở đại tràng sigma", 1, 1], ["c. Đặt sonde trực tràng, theo dõi thêm", 0, 1]], "i": null, "n": 17, "k": [2], "al": "b", "ac": "Bù dịch, mở hậu môn nhân tạo ở đại tràng sigma", "an": "Bệnh nhân già suy kiệt, ưu tiên giải áp nhanh bằng HMNT."}, {"e": 1, "c": "9", "b": 3, "o": "36", "p": [["Đâu là pp điều trị tạm bợ cho K ĐTT (hình như K góc gan di căn) gây tắc ruột?", 0, 0], ["a. Nối tắt bên bên hồi - đại tràng ngang", 1, 1], ["b. Cắt đại tràng phải mở rộng", 0, 1], ["c. Cắt đại tràng (nói chung b,c,d đều là cắt á)", 0, 1]], "i": null, "n": 18, "k": [1], "al": "a", "ac": "Nối tắt bên bên hồi - đại tràng ngang", "an": "Giải pháp phẫu thuật tạm thời khi u giai đoạn muộn không cắt được."}, {"e": 2, "c": "9", "b": 3, "o": "21", "p": [["Một bệnh nhân nữ 70 tuổi thể trạng suy kiệt, vào viện với hội chứng tắc ruột thấp. Sau khi thăm khám lâm sàng và xét nghiệm cận lâm sàng. Nguyên nhân tắc do chỗ nối của đại tràng Sigma và trực tràng. Thái độ xử trí thích hợp là:", 0, 0], ["A. Đặt sonde dạ dày, sonde hậu môn, truyền dịch, điện giải và theo dõi.", 0, 1], ["B. Xét nghiệm cần thiết, bù nước điện giải và can thiệp phẫu thuật triệt căn.", 0, 1], ["C. Xét nghiệm cần thiết, bù nước điện giải, can thiệp phẫu thuật, làm hậu môn nhân tạo đại tràng Sigma.", 1, 1], ["D. Làm xét nghiệm tiền phẫu, theo dõi và lên kế hoạch mổ chương trình.", 0, 1]], "i": null, "n": 19, "k": [3], "al": "C", "ac": "Bù nước điện giải, làm hậu môn nhân tạo ĐT Sigma", "an": "Xử trí tắc ruột thấp do u chỗ nối trực tràng - sigma trên BN suy kiệt."}, {"e": 2, "c": "9", "b": 3, "o": "59", "p": [["Sau mổ cắt đại tràng trái, 3 ngày, BN bí trung đại tiện, đau âm ỉ khắp bụng, bụng chướng, ấn không đau nghĩ do gì", 0, 0], ["A. Liệt ruột sau mổ", 1, 1], ["B. VPM", 0, 1], ["C. Tắc ruột cơ học", 0, 1]], "i": null, "n": 20, "k": [1], "al": "A", "ac": "Liệt ruột sau mổ", "an": "Hậu phẫu ngày 3, bụng chướng đều, không đề kháng, đau âm ỉ."}, {"e": 9, "c": "9", "b": 3, "o": "22", "p": [["Trong cấp cứu chẩn đoán tắc ruột thấp do ung thư đại tràng, xét nghiệm hình ảnh cần", 0, 0], ["làm:", 0, 0], ["A.Siêu âm bụng", 0, 1], ["B.Chụp khung đại tràng cản quang", 1, 1]], "i": null, "n": 21, "k": [3], "al": "B (hoặc CT)", "ac": "Chụp khung đại tràng cản quang", "an": "Xác định vị trí và hình thái hẹp lòng đại tràng do ung thư."}, {"e": 9, "c": "9", "b": 3, "o": "42", "p": [["Tắc ruột do u đại tràng, cls chẩn đoán?", 0, 0], ["A. Nội soi đại tràng", 0, 1], ["B. CT-scan", 1, 1]], "i": null, "n": 22, "k": [2], "al": "B", "ac": "CT-scan", "an": "CLS tối ưu đánh giá vị trí tắc ruột và giai đoạn u."}, {"e": 9, "c": "9", "b": 3, "o": "48", "p": [["BN nữ 70 tuổi suy kiệt. Nhập viện trong tình trạng có các triệu chứng của tắc ruột thấp. Được chẩn đoán tắc ruột do chỗ nối đại - trực tràng. Điều trị gì tiếp theo ở BN này?", 0, 0], ["A. Làm HMNT", 1, 1], ["B. PT nối vị tràng", 0, 1]], "i": null, "n": 23, "k": [1], "al": "A", "ac": "Làm hậu môn nhân tạo (HMNT)", "an": "Giải áp tắc ruột đại tràng trên bệnh nhân thể trạng yếu."}, {"e": 1, "c": "9", "b": 4, "o": "5", "p": [["BN nam 65 tuổi, nhập viện vì đau bụng quanh rốn liên tục lan sau lưng, khám hậu môn trực tràng trống, bí trung đại tiện, buồn nôn nhưng không nôn, bụng chướng vừa, ấn đau nhiều. Siêu âm bụng chướng hơi, ít dịch không đặc hiệu. XQuang ghi nhận đại tràng giãn, có mức nước hơi đại tràng và hơi ở ruột non. Chẩn đoán là gì? (2)", 0, 0], ["a. Liệt ruột nghi do viêm tụy cấp", 1, 1], ["b. Tắc ruột thấp", 0, 1], ["c. Tắc ruột thắt nghẹt", 0, 1], ["d. Tắc ruột quai kín", 0, 1]], "i": null, "n": 24, "k": [1], "al": "a", "ac": "Liệt ruột nghi do viêm tụy cấp", "an": "Đau quanh rốn lan lưng, quai ruột dãn canh gác, không phản ứng phúc mạc."}, {"e": 2, "c": "9", "b": 4, "o": "58", "p": [["Đau bụng, buồn nôn nhưng không nôn, bí trung đại tiện. xquang nhiều mức nước hơi ruột non đại tràng, siêu âm quai ruột dãn, âm ruột tăng, bụng chướng đều", 0, 0], ["A. TR cơ năng", 0, 1], ["B. TR cơ học đơn thuần", 1, 1], ["C. TR quai kín", 0, 1], ["D. TR thắt nghẹt", 0, 1]], "i": null, "n": 25, "k": [2], "al": "B", "ac": "Tắc ruột cơ học đơn thuần", "an": "Âm ruột tăng, có mức nước hơi, chưa có dấu hiệu hoại tử."}, {"e": 4, "c": "9", "b": 4, "o": "7", "p": [["BN nữ, 57 tuổi, nhập viện vì đau bụng quặn cơn kèm nôn ói nhiều và bí trung đại tiện 13 giờ cách nhập viện. Tiền căn: một năm nay thỉnh thoảng có đau quặn vùng thượng vị, nhất là sau khi ăn. Khám lâm sàng: bệnh tỉnh, không sốt, có dấu mất nước rõ. Mạch 112 lần/phút, huyết áp 93/58 mmHg. Bụng xẹp, ấn bụng mềm và không vùng đau khu trú. Dịch nôn được quan sát thấy có màu xanh mật. Theo bạn chẩn đoán thích hợp nhất: (1 Điểm)", 0, 0], ["Tắc ruột cao", 1, 0], ["Xoắn ruột non.", 0, 0], ["Nghẹt môn vị.", 0, 0], ["Viêm tụy cấp.", 0, 0]], "i": null, "n": 26, "k": [1], "al": "A", "ac": "Tắc ruột cao", "an": "Nôn ói nhiều ra dịch mật, bụng xẹp, mất nước sớm."}, {"e": 4, "c": "9", "b": 4, "o": "17", "p": [["Bệnh nhân nam 48 tuổi nhập viện vì đau khắp bụng. Bệnh nhân đau bụng quặn cơn khắp bụng ngày càng tăng 2 ngày. Bệnh nhân bí trung đại tiện hoàn toàn 1 ngày nay. Triệu chứng kèm theo: buồn nôn và nôn ra thức ăn cũ, bụng trướng. X quang bụng có hình ảnh:", 0, 0], ["Ống hơi hình chữ U lộn ngược chiếm gần hết xoang bụng, hai chân của chữ U hướng về vùng hố chậu trái. Chẩn đoán nào sau đây được nghĩ tới nhiều nhất(1 Điểm)", 0, 0], ["Tắc ruột do dây dính tự nhiên", 0, 0], ["Xoắn đại tràng sigma", 1, 0], ["Tắc ruột do u đại tràng xuống", 0, 0], ["Lồng hồi manh tràng", 0, 0]], "i": null, "n": 27, "k": [3], "al": "B", "ac": "Xoắn đại tràng sigma", "an": "Hình ảnh ống hơi chữ U lộn ngược (hạt cà phê) hướng về hố chậu trái."}, {"e": 6, "c": "9", "b": 4, "o": "4", "p": [["BN nữ, 57 tuổi, nhập viện vì đau bụng quặn cơn kèm nôn ói nhiều và bí trung đại tiện 13 giờ cách nhập viện. Tiền căn: một năm nay thỉnh thoảng có đau quặn vùng thượng vị, nhất là sau khi ăn. Khám lâm sàng: bệnh tỉnh, không sốt, có dấu mất nước rõ. Mạch 112 lần/phút, huyết áp 93/58 mmHg. Bụng xẹp, ấn bụng mềm và không vùng đau khu trú. Dịch nôn được quan sát thấy có màu xanh mật. Theo bạn chẩn đoán thích hợp nhất:(1 Điểm)", 0, 0], ["A. Tắc ruột cao", 1, 1], ["B. Xoắn ruột non.", 0, 1], ["C. Nghẹt môn vị.", 0, 1], ["D. Viêm tụy cấp.", 0, 1]], "i": null, "n": 28, "k": [1], "al": "A", "ac": "Tắc ruột cao", "an": "Bụng xẹp, nôn dịch mật sớm, sinh hiệu mạch nhanh tụt áp."}, {"e": 6, "c": "9", "b": 4, "o": "15", "p": [["Bệnh nhân nam 48 tuổi nhập viện vì đau khắp bụng. Bệnh nhân đau bụng quặn cơn khắp bụng ngày càng tăng 2 ngày. Bệnh nhân bí trung đại tiện hoàn toàn 1 ngày nay. Triệu chứng kèm theo: buồn nôn và nôn ra thức ăn cũ, bụng trướng. X quang bụng có hình ảnh: Ống hơi hình chữ U lộn ngược chiếm gần hết xoang bụng, hai chân của chữ U hướng về vùng hố chậu trái. Chẩn đoán nào sau đây được nghĩ tới nhiều nhất(1 Điểm)", 0, 0], ["A. Tắc ruột do dây dính tự nhiên", 0, 1], ["B. Xoắn đại tràng sigma", 1, 1], ["C. Tắc ruột do u đại tràng xuống", 0, 1], ["D. Lồng hồi manh tràng", 0, 1]], "i": null, "n": 29, "k": [2], "al": "B", "ac": "Xoắn đại tràng sigma", "an": "Dấu hiệu chữ U lộn ngược chiếm gần hết xoang bụng."}, {"e": 7, "c": "9", "b": 4, "o": "10", "p": [["Dấu hiệu nào sau đây là giá trị nhất để phân biệt tắc ruột cơ học đến muộn với tắc ruột cơ năng?", 0, 0], ["A. Đau quặn từng cơn, đau rắn bò", 0, 1], ["B. Nhiễm trùng nhiễm độc", 0, 1], ["C. Viêm phúc mạc", 0, 1], ["D. Dấu chuyển tiếp trên CT scan bụng", 1, 1]], "i": null, "n": 30, "k": [4], "al": "D", "ac": "Dấu chuyển tiếp trên CT scan bụng", "an": "Dấu hiệu khách quan nhất phân biệt cơ học đến muộn (đờ ruột) và cơ năng."}, {"e": 9, "c": "9", "b": 4, "o": "38", "p": [["Một BN nam, 63 tuổi, 8 giờ trước nhập viện đau bụng từng cơn kèm nôn ói, và bí trung tiện. Tám năm trước, BN được mổ cắt bán phần dạ dày nối vị tràng do loét tá tràng gây nghẹt môn vị. Khám lâm sàng: dấu rắn bò, nghe âm ruột tăng tần số và âm sắc. XQ bụng KSS quai ruột non chướng và mức hơi nước, không hơi trong đại tràng. Chẩn đoán?", 0, 0], ["A. Tắc ruột do u đại tràng", 0, 1], ["B. Tắc ruột do sỏi mật", 0, 1], ["C. Tắc ruột do bã thức ăn", 1, 1], ["D. Tắc ruột do thoát vị bẹn nghẹt", 0, 1]], "i": null, "n": 31, "k": [3], "al": "C", "ac": "Tắc ruột do bã thức ăn", "an": "Tiền căn cắt dạ dày làm giảm sức co bóp nghiền nát thức ăn sợi xơ."}, {"e": 9, "c": "9", "b": 4, "o": "47", "p": [["Nguyên vùng bụng trái sưng toàn bộ, bí trung đại tiện, XQ mực hơi nước ổ bụng không có hơi tự do, HA 88/56. Xử trí?", 0, 0], ["A. Nội soi tháo xoắn", 0, 1], ["B. Mổ mơ", 0, 1], ["C. Hồi sức", 1, 1]], "i": null, "n": 32, "k": [3], "al": "C", "ac": "Hồi sức", "an": "Bệnh nhân đang có sốc (HA 88/56), bắt buộc hồi sức trước phẫu thuật."}], "imgs": ["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAhoAAAEMCAIAAAANvIhqAAAACXBIWXMAAAsSAAALEgHS3X78AAAgAElEQVR42uy9d3Rc13kvuts5Z/qgdxAgAbCCVSwQSYmURMmmCkkVykWS7bhl2Ynj2M7yipOV53vXumtdXydOfK8dxyWRXFRtmaREUhIlkmLvDWABiN7bDIABpp2yy/vjAw6PQFo38Xt5zl158wcIDmbO2fvbX/195eDXXnrZtm2fzxcOh6QUjJFgMBgIBAghtm0Hg0EhhGEYgUCAc66U8vl8hBCllJSSEEIplVI6juM4jpRSSskYQwhRSnVdxxhLKYUQUkp4E/4K/4UrwGc453A1pRTcSAgBfxVC6LruOA7nHK6glBKSM8ZgJRhj+BhCiDEGS/JehFJKCHEcRyllGAb8FWOMPviCNUspTdNECLnbhFu4y4PFwztq5gVLxRhTSh3HyWazlFJKqRDC7/czxmzb5nx6zZxzuL6Qkgth+AyEseM4QArvehhjSCnHtDDG8F3YpvtJuDvcmhBiWZamaX6/X0rpbhC24N0pXO0D7yDsOBxInc1mY7FYTk4OY8zn8wHFhBCapnkvxRibRUOXDrPIAr+7S3J/3n4EEiOJlEtwd7+eeyAiZ+8FfiGEIIQQwUJNf8J7fe+qkJBYIfcc4WNeSs4il/t12ALGWBEslVJIuZzgXsr7yVlXcJnEJQicMpwRfMWyLIQQ0FwJyTBxaQt7BK5zySWkwIR4yeXua/pEpMIIeykvhIC7w2mCyMAWXBK57A2rmqbtbcT0EhAu6DLnrIODvc+iqpc9YP3uGmCd3ovDqmZxjisUUkpECMIIkVuf8bKrV5a9Z+GVuDuwygzN4Zi873s/fwdOnrm1u3GXjEoppChC+I5s/Hu/7riM/49fjDEmpdR13TB8jmMRgiilmqaBsgDV7NWkLp+5hAZVDoeqlNI0jXMuhHAcB8gHX4eTcxwHlKxreEDJaprmPW+llKuOOee6rmuaBvcFpS8kTyaTuq4Hg0HQ1LPOjDEGd/FKCNwxm81qmuZaIPcFJg3sGci5EAI25ZICiOMaEkIIGCeXKeGy8A7cHe4C+9V13TRNV4a D.q.forEach((q,i)=>{q.id=i;q.hasA=q.p.some(x=>x[1])});
const $=id=>document.getElementById(id);
$('fe').innerHTML='<option value="all">Mọi đề / năm</option>'+D.exams.map((e,i)=>`<option value="${i}">${e}</option>`).join('');
$('fc').innerHTML='<option value="all">Tất cả chương</option>'+Object.entries(D.chapters).map(([k,v])=>`<option value="${k}">Chương ${k}. ${v}</option>`).join('');
$('fb').innerHTML='<option value="all">Mọi mức Bloom</option>'+[1,2,3,4].map(b=>`<option value="${b}">${BL[b]}</option>`).join('');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=s=>{s=esc(s);if(!st.s)return s;const k=esc(st.s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return s.replace(new RegExp(k,'gi'),m=>`<mark>${m}</mark>`)};
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
function grpName(q){return q.c==='X'?'Ngoài 9 chương · '+q.t:`Chương ${q.c}. ${D.chapters[q.c]}`}
function render(){
  let L=D.q.filter(q=>(st.e==='all'||q.e==+st.e)&&(st.c==='all'||q.c===st.c)&&(st.b==='all'||q.b==+st.b)&&(!st.ans||q.hasA)&&(!st.star||S.star[q.id])&&(!st.s||norm(q.p.map(x=>x[0]).join(' ')).includes(norm(st.s))));
  if(st.shuf){L=L.slice();for(let i=L.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]]}}
  const done=Object.keys(S.done).filter(k=>L.some(q=>q.id==k)),right=done.filter(k=>S.done[k]).length;
  $('stats').textContent=`${L.length} câu · ${L.filter(q=>q.hasA).length} câu chấm được · đã làm ${done.length}, đúng ${right}`+(done.length?` (${Math.round(right*100/done.length)}%)`:'');
  if(!L.length){$('list').innerHTML='<div class="empty">Không có câu nào khớp bộ lọc.</div>';return}
  let h='',le=null,lg=null;
  for(const q of L){
    if(!st.shuf){if(q.c!==le){const nc=D.q.filter(x=>x.c===q.c).length;h+=`<div class="exam">Chương ${q.c}. ${D.chapters[q.c]} <span class="meta">(${nc} câu)</span></div>`;le=q.c;lg=null}
      if(q.b!==lg){h+=`<div class="grp"><span class="b${q.b}">Mức ${q.b} · ${BL[q.b]}</span></div>`;lg=q.b}}
    h+=card(q);
  }
  $('list').innerHTML=h;
}
function card(q){
  let stem='',body='',first=true;
  q.p.forEach((x,i)=>{
    if(first&&!x[2]){stem=x[0];first=false;return}first=false;
    if(x[2]||(!q.p.some(y=>y[2])&&q.hasA)){
      const a=S.done[q.id]!==undefined, pick=S.pick&&S.pick[q.id]===i;
      let cls='opt';
      if(st.mode==='show'&&x[1])cls+=' ok';
      if(a){if(x[1])cls+=' ok';else if(pick)cls+=' bad'}
      if(!q.hasA)cls+=' na';
      body+=`<button class="${cls}" data-q="${q.id}" data-i="${i}">${hl(x[0])}</button>`;
    } else body+=`<div class="line">${hl(x[0])}</div>`;
  });
  let fb='';
  const ex=`<div class="exp"><b>Đáp án: ${esc(q.al)}</b> – ${esc(q.ac)}<br><span>💡 ${esc(q.an)}</span></div>`;
  const shown=st.mode==='show'||S.done[q.id]!==undefined||S.rev[q.id];
  if(S.done[q.id]!==undefined)fb=`<div class="fb" style="color:var(${S.done[q.id]?'--ok':'--bad'})">${S.done[q.id]?'✔ Đúng':'✘ Chưa đúng'}</div>`;
  if(shown)fb+=ex; else if(!q.hasA)fb+=`<button class="rv" data-r="${q.id}">Xem đáp án</button>`;
  const im=q.i!==null&&q.i!==undefined?`<img src="${D.imgs[q.i]}" alt="Ảnh câu hỏi trong file gốc">`:'';
  return `<div class="card"><div class="qh"><span class="num">Câu ${q.c}.${q.n}</span><span class="tag b${q.b}">${BL[q.b]}</span><span class="tag yr">${D.exams[q.e]}</span>${q.o?`<span class="meta">câu ${q.o} trong đề</span>`:''}${st.shuf?`<span class="meta">· Chương ${q.c}</span>`:''}<button class="star" data-s="${q.id}" title="Đánh dấu">${S.star[q.id]?'★':'☆'}</button></div>${stem?`<div class="stem">${hl(stem)}</div>`:''}${body}${im}${fb}</div>`;
}
S.pick={};
$('list').addEventListener('click',ev=>{
  const s=ev.target.closest('[data-s]');if(s){const id=s.dataset.s;S.star[id]?delete S.star[id]:S.star[id]=1;save();s.textContent=S.star[id]?'★':'☆';return}
  const r=ev.target.closest('[data-r]');if(r){S.rev[r.dataset.r]=1;const c=r.closest('.card');c.outerHTML=card(D.q[+r.dataset.r]);return}
  const b=ev.target.closest('.opt');if(!b||st.mode!=='quiz')return;
  const q=D.q[+b.dataset.q];if(!q.hasA||S.done[q.id]!==undefined)return;
  const i=+b.dataset.i;S.pick[q.id]=i;S.done[q.id]=!!q.p[i][1];
  const c=b.closest('.card');c.outerHTML=card(q);
  render._t&&clearTimeout(render._t);
  const L=$('stats');L.textContent=L.textContent; updStats();
});
function updStats(){const keep=scrollY;render();scrollTo(0,keep)}
['fe','fc','fb'].forEach(id=>$(id).onchange=e=>{st[id[1]]=e.target.value;render()});
let tm;$('fs').oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{st.s=e.target.value.trim();render()},200)};
const tog=(id,f)=>$(id).onclick=()=>{f();render()};
tog('mQuiz',()=>{st.mode='quiz';$('mQuiz').classList.add('on');$('mShow').classList.remove('on')});
tog('mShow',()=>{st.mode='show';$('mShow').classList.add('on');$('mQuiz').classList.remove('on')});
tog('fAns',()=>{st.ans=!st.ans;$('fAns').classList.toggle('on',st.ans)});
tog('fStar',()=>{st.star=!st.star;$('fStar').classList.toggle('on',st.star)});
tog('shuf',()=>{st.shuf=!st.shuf;$('shuf').classList.toggle('on',st.shuf)});
tog('reset',()=>{S.done={};S.pick={};S.rev={}});
render();
</script></body></html>
